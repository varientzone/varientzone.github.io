<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c1020">
<meta name="description" content="System Index — systems, storage, DJ ideas, and music production tools.">
<title>System Index</title>
<style>
:root{color-scheme:dark;--bg:#0c1020;--panel:#171d30;--border:#30384f;--text:#f1f3ff;--muted:#a3aec7;--accent:#b6a4ff}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(ellipse 70% 55% at 80% 3%,#28305b 0%,transparent 75%),radial-gradient(ellipse 50% 50% at 5% 85%,#161d36 0%,transparent 80%),var(--bg)}
a{color:inherit;text-decoration:none}
.wrap{max-width:1050px;margin:0 auto;padding:36px 28px 30px;min-height:100vh;display:flex;flex-direction:column}
main{flex:1;padding:65px 0 65px}
.kicker{color:var(--accent);font-weight:800;font-size:12px;letter-spacing:.17em;text-transform:uppercase}
h1{font-size:clamp(38px,6.4vw,70px);letter-spacing:-.065em;line-height:1.07;margin:17px 0 20px;max-width:750px;font-weight:790}
.lead{font-size:clamp(15px,1.8vw,18px);line-height:1.7;color:var(--muted);max-width:580px;margin:0 0 49px}
.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:17px}
.sectionhead h2{font-size:13px;letter-spacing:.15em;text-transform:uppercase;color:#c7d0e6;margin:0}
.sectionhead span{font-size:12px;color:#8793ae}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.tile{position:relative;display:flex;flex-direction:column;min-height:265px;padding:30px 32px 28px;background:linear-gradient(145deg,#1b2135,#151b2c);border:1px solid var(--border);border-radius:18px;transition:transform .2s ease,border-color .2s ease,background .2s ease,box-shadow .2s ease;overflow:hidden}
.tile:hover{transform:translateY(-4px);border-color:#8274bc;background:linear-gradient(145deg,#252943,#191e32);box-shadow:0 16px 35px #0003}
.tile:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.tiletop{display:flex;justify-content:space-between;align-items:flex-start}
.symbol{width:56px;height:56px;display:grid;place-items:center;border-radius:12px;background:#2b2a49;color:#c6baff}
.symbol svg{width:29px;height:29px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.arrow{font-size:23px;color:#9ca7c2;line-height:1;transition:transform .2s ease,color .2s ease}
.tile:hover .arrow{transform:translate(3px,-3px);color:#d2c9ff}
.tile h3{font-size:clamp(24px,3vw,32px);letter-spacing:-.04em;margin:auto 0 0;padding-top:48px}
.tile p{color:#a8b4cd;font-size:13px;line-height:1.6;margin:0;max-width:350px}
.tile small{display:block;color:#8f9bb5;letter-spacing:.13em;font-size:10px;font-weight:750;margin-top:auto;padding-top:18px}
@media(max-width:650px){.wrap{padding:22px 17px}main{padding:48px 0 45px}.lead{margin-bottom:35px}.grid{grid-template-columns:1fr}.tile{min-height:210px;padding:25px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<main>
<h1>System Index<span style="color:#b6a4ff">.</span></h1>
<nav class="grid" aria-label="Website sections">
<a class="tile" href="./system-usage/"><div class="tiletop"><span class="symbol" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg></span><span class="arrow" aria-hidden="true">↗</span></div><h3>System Usage</h3></a>
<a class="tile" href="./system-storage/"><div class="tiletop"><span class="symbol" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M7 14h.01M11 14h.01M3 10h18"/></svg></span><span class="arrow" aria-hidden="true">↗</span></div><h3>System Storage</h3></a>
<a class="tile" href="./mashup-ideas/"><div class="tiletop"><span class="symbol" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2"/><path d="M12 3v3M21 12h-3"/></svg></span><span class="arrow" aria-hidden="true">↗</span></div><h3>Mashup Ideas</h3></a>
<a class="tile" href="./plugins-tracker/"><div class="tiletop"><span class="symbol" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 17h16M8 4v6M16 14v6"/><circle cx="8" cy="7" r="2"/><circle cx="16" cy="17" r="2"/></svg></span><span class="arrow" aria-hidden="true">↗</span></div><h3>Plugins Tracker</h3></a>
</nav>
</main>
</div>
</body>
</html>
